    <style>
        :root {
            --bg-primary: #faf9f5;
            --text-primary: #0a0a0a;
            --border-color: #f2f2f2;
            --header-bg: rgba(250, 249, 245, 0.95);
        }

        html {
            background-color: var(--bg-primary);
            transition: background-color 0.25s ease;
        }

        html.dark {
            --bg-primary: #262624;
            --text-primary: #ededed;
            --border-color: #4a4a47;
            --header-bg: rgba(38, 38, 36, 0.95);
        }
        
        /* Eliminate elastic bounce (rubber-banding) for static UI components */
        html, body {
            overscroll-behavior-y: none;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            font-family: "Newsreader", serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            letter-spacing: normal;
            overflow-x: hidden;
            overflow-y: scroll;
            scrollbar-gutter: stable;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0;
        }

        .newsreader {
            font-family: "Newsreader", serif;
            font-weight: 400;
        }

        .tracking-tight-titles {
            letter-spacing: -0.01em;
            line-height: 1.05;
        }

        .thin-border {
            border: 0.5px solid var(--border-color);
        }

        .page-fade-in { /* fade handled by wrapper opacity transition in App */ }

        /* Strictly Fixed Header (top-level nav only) */
        header.app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            transform: translateZ(0);
            will-change: transform;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 0.5px solid var(--border-color);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        /* iOS safe-area support for fixed mobile header and first-screen content */
        .mobile-header-row {
            padding-top: calc(env(safe-area-inset-top, 0px) + 0.5rem);
            padding-bottom: 0.75rem;
        }

        .app-main {
            padding-top: calc(env(safe-area-inset-top, 0px) + 4rem);
        }

        @media (min-width: 640px) {
            .app-main {
                padding-top: 4.5rem;
            }
        }

        @media (min-width: 768px) {
            .app-main {
                padding-top: 4.75rem;
            }
        }

        /* Enforce Hard Corners for professional look */
        * { border-radius: 0 !important; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e5e5; }
        html.dark ::-webkit-scrollbar-thumb { background: #404040; }
        ::-webkit-scrollbar-thumb:hover { background: #d4d4d4; }
        html.dark ::-webkit-scrollbar-thumb:hover { background: #525252; }

        /* ===== Intro overlay (curtain / page peel) ===== */
        .intro-overlay {
          position: fixed;
          inset: 0;
          z-index: 10000;
          font-family: "Fraunces", serif;
          overflow: hidden;
        }

        .intro-cover {
          position: absolute; inset: 0;
          background: var(--bg-primary);
          color: var(--text-primary);
          --peel: 96px;
          clip-path: polygon(
            0 0,
            calc(100% - var(--peel)) 0,
            100% var(--peel),
            100% 100%,
            0 100%
          );
          transition: clip-path 420ms cubic-bezier(.2,.8,.2,1);
          padding: clamp(20px, 4vw, 56px) clamp(20px, 5vw, 80px) clamp(28px, 4vw, 64px);
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
        .intro-overlay:has(.intro-peel:hover) .intro-cover { --peel: 128px; }
        .intro-overlay.entering .intro-cover {
          --peel: 320% !important;
          transition: clip-path 950ms cubic-bezier(.6,0,.2,1);
        }

        .intro-top { display: flex; flex-direction: column; gap: 2px; }
        .intro-top .intro-name { font-style: italic; font-size: 17px; color: var(--text-primary); }
        .intro-top .intro-date { font-style: italic; font-size: 13px; color: #8c8a85; }
        html.dark .intro-top .intro-date { color: #8a8780; }

        .intro-mid {
          flex: 1;
          display: flex;
          align-items: flex-end;
          padding-top: clamp(32px, 6vw, 80px);
          padding-bottom: 0;
        }
        .intro-line {
          font-style: italic;
          font-weight: 300;
          font-size: clamp(28px, 4.6vw, 48px);
          line-height: 1.1;
          letter-spacing: -0.018em;
          max-width: 20ch;
          color: var(--text-primary);
        }
        .intro-figure {
          position: absolute;
          top: 45%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: min(56vw, 680px);
          pointer-events: none;
        }
        .intro-word {
          display: inline-block;
          white-space: nowrap;
        }
        .intro-figure img {
          display: block;
          width: 100%;
          height: auto;
          filter: saturate(0.92);
        }
        .intro-figure figcaption {
          margin-top: 10px;
          font-style: italic;
          font-size: 12px;
          color: #8c8a85;
          text-align: center;
          letter-spacing: 0.02em;
        }
        html.dark .intro-figure figcaption { color: #8a8780; }
        .intro-line .ch {
          display: inline-block;
          transition: transform 280ms cubic-bezier(.2,.8,.2,1);
          will-change: transform;
        }
        .intro-line .ch.space { width: 0.28em; }

        .intro-foot {
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          flex-wrap: wrap;
          gap: 20px;
        }
        .intro-sub {
          font-style: italic;
          font-size: 14px;
          color: #8c8a85;
          max-width: 44ch;
        }
        html.dark .intro-sub { color: #8a8780; }
        .intro-clocks { display: flex; gap: 28px; }
        .intro-clocks .c { text-align: right; }
        .intro-clocks .city {
          font-style: italic;
          font-size: 10px;
          color: #b0aea7;
          letter-spacing: 0.04em;
        }
        html.dark .intro-clocks .city { color: #6a6863; }
        .intro-clocks .time {
          font-family: ui-monospace, "SF Mono", Menlo, monospace;
          font-size: 15px;
          margin-top: 2px;
          color: var(--text-primary);
        }

        /* peel */
        .intro-peel {
          position: absolute;
          top: 0; right: 0;
          width: 96px; height: 96px;
          cursor: pointer;
          z-index: 5;
          transition: width 420ms cubic-bezier(.2,.8,.2,1), height 420ms cubic-bezier(.2,.8,.2,1);
        }
        .intro-peel:hover { width: 128px; height: 128px; }
        .intro-overlay.entering .intro-peel {
          width: 340% !important; height: 340% !important;
          transition: width 950ms cubic-bezier(.6,0,.2,1), height 950ms cubic-bezier(.6,0,.2,1);
        }
        .intro-peel .pshadow {
          position: absolute; inset: 0;
          clip-path: polygon(0 0, 100% 100%, 0 100%);
          background: #000;
          filter: blur(10px);
          opacity: 0.18;
          transform: translate(-4px, 4px);
        }
        html.dark .intro-peel .pshadow { opacity: 0.36; }
        .intro-peel .pback {
          position: absolute; inset: 0;
          clip-path: polygon(0 0, 100% 100%, 0 100%);
          background: linear-gradient(225deg,
            #fdfcf7 0%,
            #f4f1e8 25%,
            #e6e1d2 60%,
            #c8c2b0 95%,
            #b6b09c 100%);
        }
        html.dark .intro-peel .pback {
          background: linear-gradient(225deg,
            #3e3a36 0%,
            #322f2c 25%,
            #25221f 60%,
            #1a1815 95%,
            #100f0d 100%);
        }
        .intro-peel .pback::before {
          content: "";
          position: absolute; inset: 0;
          clip-path: polygon(0 0, 100% 100%, 0 100%);
          background: linear-gradient(225deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 8%);
          pointer-events: none;
        }
        html.dark .intro-peel .pback::before {
          background: linear-gradient(225deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 8%);
        }
        .intro-peel .pback::after {
          content: "";
          position: absolute; inset: 0;
          clip-path: polygon(0 0, 100% 100%, 0 100%);
          background: radial-gradient(60% 60% at 0% 100%, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 70%);
          pointer-events: none;
        }
        .intro-peel .phint {
          position: absolute;
          left: 10%; bottom: 25%;
          font-style: italic;
          font-size: 12px;
          color: #4a4540;
          opacity: 0;
          transition: opacity 240ms 120ms;
          pointer-events: none;
          white-space: nowrap;
        }
        html.dark .intro-peel .phint { color: #d6d2c8; }
        .intro-peel:hover .phint { opacity: 0.9; }
        .intro-overlay.entering .intro-peel .phint { opacity: 0; }
        .intro-overlay.entering .intro-cover > * { opacity: 0; transition: opacity 280ms; }

        @media (max-width: 640px) {
          .intro-cover { --peel: 80px; }
          .intro-peel { width: 80px; height: 80px; }
          .intro-peel:hover { width: 140px; height: 140px; }
          .intro-foot { flex-direction: column; align-items: flex-start; }
          .intro-clocks { gap: 22px; }
          .intro-clocks .c { text-align: left; }
          .intro-figure { width: 70vw; max-width: 280px; }
        }

        @media print {
            html, html.dark {
                --bg-primary: #ffffff;
                --text-primary: #000000;
                --border-color: #cccccc;
                background: #ffffff !important;
                color: #000000 !important;
            }
            header, footer, nav, button { display: none !important; }
            .app-main { padding-top: 0 !important; }
            main, .page-fade-in { opacity: 1 !important; transform: none !important; }
            a { color: #000 !important; text-decoration: none; }
            a[href]::after { content: " (" attr(href) ")"; font-size: 0.85em; color: #555; }
            * {
                background: transparent !important;
                box-shadow: none !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
